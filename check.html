<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>保健だより作成チェック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
:root{
  --bg:#EEECE7; --paper:#FFFFFF; --panel:#FAF9F6; --ink:#262626; --muted:#5E5E5E; --faint:#929292; --line:#D3D0C9;
  --accent:#2B5D8A; --accent-ink:#FFFFFF;
  --need:#C4472D; --tech:#2B5D8A; --ok:#2E7A4C;
  --hl-need:#FBE3DC; --hl-tech:#E1EAF3;
  --sans:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --paperfont:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Kaku Gothic ProN",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1E1E1D; --paper:#FFFFFF; --panel:#262625; --ink:#E5E5E3; --muted:#ABABA8; --faint:#7D7D7A; --line:#3C3C3A;
    --accent:#8DB6DD; --accent-ink:#1E1E1D; --need:#EE8F78; --tech:#8DB6DD; --ok:#78C796;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1E1E1D; --paper:#FFFFFF; --panel:#262625; --ink:#E5E5E3; --muted:#ABABA8; --faint:#7D7D7A; --line:#3C3C3A;
  --accent:#8DB6DD; --accent-ink:#1E1E1D; --need:#EE8F78; --tech:#8DB6DD; --ok:#78C796;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.7}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* 上の帯 */
.bar{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{max-width:1480px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.bar h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap}
.bar .set{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.bar label{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.bar select{font-size:13px;padding:3px 4px;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:#262626}
.bar .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--paper);color:#262626;border-radius:3px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}

/* 3列 */
.work{max-width:1480px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) 320px;gap:16px;align-items:start}
@media (max-width:1240px){.work{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)} .checks{grid-column:1/-1}}
@media (max-width:820px){.work{grid-template-columns:minmax(0,1fr)} .checks{grid-column:auto}}
.colh{font-size:12px;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}

/* 入力 */
.edit{display:grid;gap:8px}
.edit input,.edit textarea{width:100%;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:#262626;padding:7px 9px}
.edit .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.edit textarea{min-height:520px;line-height:1.9;resize:vertical;font-size:15px}
.hint{font-size:12px;color:var(--muted)}

/* 紙面 */
.sheetwrap{position:sticky;top:58px}
@media (max-width:820px){.sheetwrap{position:static}}
.sheet{background:var(--paper);color:#222;box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.06);aspect-ratio:210/297;overflow:auto;padding:7% 8%;font-family:var(--paperfont);font-size:14px;line-height:2.1}
.sheet .ttl{font-size:26px;font-weight:700;text-align:center;line-height:1.6;border-bottom:3px double #444;padding-bottom:4px}
.sheet .meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#555;margin:6px 0 14px;line-height:1.6}
.sheet .hd{font-weight:700;font-size:16px;margin-top:10px;border-left:5px solid #6B8FB3;padding-left:8px;line-height:1.8}
.sheet p{margin:0}
.sheet .blank{height:.9em}
.sheet rt{font-size:.5em;color:#333;font-weight:400}
.sheet.marks .need{background:var(--hl-need);box-shadow:inset 0 -2px 0 #C4472D}
.sheet.marks .tech{text-decoration:underline 2px #2B5D8A;text-underline-offset:5px}
.sheet.marks .long{background:linear-gradient(transparent 88%,#E3B341 88%)}
.sheet .empty{color:#999;text-align:center;margin-top:30%}

/* 確認 */
.checks{display:grid;gap:12px}
.ck{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px;display:grid;gap:6px}
.ck h2{font-size:13.5px;margin:0;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ck h2 small{font-weight:400;color:var(--muted);font-size:12px}
.ck p,.ck li{font-size:13px}
.ck ul{margin:0;padding-left:1.1em;display:grid;gap:2px}
.ck .muted{color:var(--muted)}
.rubylist{display:grid;gap:3px;max-height:280px;overflow:auto}
.rubylist .r{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px}
.rubylist .base{font-family:var(--paperfont);font-size:15px;min-width:3em}
.rubylist input{width:100%;padding:2px 6px;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:#262626;font-size:13px}
.rubylist input.miss{border-color:var(--need);background:#FDF0EC}
.rubylist .c{color:var(--faint);font-size:11.5px}
table.tp{border-collapse:collapse;width:100%;font-size:13px}
table.tp td{padding:2px 0;border-bottom:1px dotted var(--line)}
table.tp td.n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;width:4em}
table.tp td.y{width:3.5em;text-align:right}
.y-on{color:var(--ok);font-weight:700}.y-off{color:var(--faint)}
.lv{font-size:13px}
.lv b{font-variant-numeric:tabular-nums}
.foot{max-width:1480px;margin:8px auto 40px;padding:0 16px;font-size:12px;color:var(--muted);display:grid;gap:2px}
.status{font-size:12px;color:var(--muted)}
</style>

<div class="bar"><div class="bar-in">
  <h1>保健だより作成チェック</h1>
  <div class="set">
    <label>発行月 <select id="month"></select></label>
    <label>読み手 <select id="grade">
      <option value="1">小学1年</option><option value="2">小学2年</option><option value="3" selected>小学3年</option>
      <option value="4">小学4年</option><option value="5">小学5年</option><option value="6">小学6年</option>
      <option value="7">中学生</option><option value="0">保護者</option>
    </select></label>
    <label>ルビ <select id="rubymode">
      <option value="need" selected>まだ習わない漢字</option><option value="all">すべての漢字</option><option value="none">振らない</option>
    </select></label>
    <label>地方 <select id="block"><option value="">全国</option></select></label>
    <label><input type="checkbox" id="marks" checked> 確認の印</label>
  </div>
  <span class="sp"></span>
  <span class="status" id="status">読みの辞書を読み込み中…</span>
  <label class="set" style="color:var(--muted);font-size:13px">Word の字体 <select id="font">
    <option value="UD デジタル 教科書体 N-R">UD デジタル教科書体</option>
    <option value="BIZ UDPゴシック">BIZ UDPゴシック</option>
    <option value="游ゴシック">游ゴシック</option>
    <option value="游明朝">游明朝</option>
  </select></label>
  <button class="btn main" id="docx" type="button">Word で書き出す</button>
</div></div>

<div class="work">
  <section class="edit" aria-label="入力">
    <div class="colh"><span>原稿</span><span><button class="btn" id="sample" type="button">例文</button> <button class="btn" id="clear" type="button">新しく書く</button></span></div>
    <input id="title" placeholder="題名（例：ほけんだより　6月号）" aria-label="題名">
    <div class="two">
      <input id="org" placeholder="学校名・保健室" aria-label="学校名・保健室">
      <input id="date" placeholder="発行日（例：令和8年6月1日）" aria-label="発行日">
    </div>
    <textarea id="draft" spellcheck="false" aria-label="本文" placeholder="本文を書くか、貼り付けてください。&#10;&#10;■ や【 】で始まる行は見出しになります。&#10;空行で段落を分けます。"></textarea>
    <p class="hint">原稿はこのブラウザの中だけで処理し、外には送りません（この端末に自動で保存します）。</p>
  </section>

  <section aria-label="紙面">
    <div class="colh"><span>紙面（A4）</span><span id="sheetinfo"></span></div>
    <div class="sheetwrap"><div class="sheet marks" id="sheet"></div></div>
  </section>

  <aside class="checks" aria-label="確認">
    <div class="colh"><span>確認</span></div>
    <div class="ck"><h2>ルビ <small id="ruby-n"></small></h2>
      <p class="muted" id="ruby-note"></p>
      <div class="rubylist" id="rubylist"></div>
    </div>
    <div class="ck"><h2>説明を添えたい言葉 <small id="tech-n"></small></h2><div id="tech"></div></div>
    <div class="ck"><h2>長い文 <small id="long-n"></small></h2><div id="long"></div></div>
    <div class="ck"><h2 id="topic-h">今月よく書かれる話題</h2><table class="tp" id="topics"></table><p class="muted" id="topic-note" style="font-size:12px"></p></div>
    <div class="ck"><h2>分量と漢字</h2><div id="levels"></div></div>
  </aside>
</div>

<div class="foot">
  <div>判定の根拠：学年別漢字配当表（2020年施行、1,026字）・常用漢字表・話題の語彙辞書と、全国の学校が公開している保健だより <span id="n-issues"></span> 号の集計値。AI は使わず、決まった規則で判定しています。</div>
  <div>読みは辞書（kuromoji）による自動推定です。誤りがありうるので、書き出す前に「ルビ」の一覧で確かめてください。直した読みはこの端末に保存されます。</div>
</div>

// 1語を「漢字の並び＋読み」と「かな」に分ける。送りがなを読みの両端から外す
function align(surface,reading){
  const parts=surface.match(/[一-鿿㐀-䶿々〆ヶ]+|[^一-鿿㐀-䶿々〆ヶ]+/g)||[];
  if(!parts.some(p=>isK(p[0])))return [{t:surface}];
  const rd=reading&&reading!=="*"?kata2hira(reading):"";
  if(rd){const re=new RegExp("^"+parts.map(p=>isK(p[0])?"(.+?)":kata2hira(p).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("")+"$");
    const m=rd.match(re);
    if(m){let k=1;return parts.map(p=>isK(p[0])?{t:p,r:m[k++]}:{t:p});}}
  // 合わないとき：漢字を含む部分をまとめて1つのルビに
  return [{t:surface,r:rd||""}];
}

const YRE=new RegExp("("+Object.keys(YOMI).sort((a,b)=>b.length-a.length).join("|")+")");
// 本文の1行 → [{t, r?}]（漢字の並びには推定の読み）
function segLine(line){
  if(!line)return [];
  const out=[];
  line.split(YRE).forEach((part,i)=>{
    if(!part)return;
    if(i%2){align(part,YOMI[part]).forEach(x=>out.push(x));return;}
    if(!TOK){(part.match(/[一-鿿㐀-䶿々〆ヶ]+|[^一-鿿㐀-䶿々〆ヶ]+/g)||[]).forEach(p=>out.push(isK(p[0])?{t:p,r:""}:{t:p}));return;}
    TOK.tokenize(part).forEach(w=>align(w.surface_form,w.reading).forEach(x=>out.push(x)));});
  return out;
}

/* 判定 */
function needRuby(base,mode,grade){
  if(mode==="none")return false;if(mode==="all")return true;
  if(grade===0)return false;
  const lim=grade===7?7:grade;
  return [...base].some(c=>isK(c)&&lv(c)>lim);
}
function analyse(){
  const grade=+$("grade").value,mode=$("rubymode").value;
  const title=$("title").value,body=$("draft").value;
  const lines=body.split("\n");
  const doc={title:segLine(title),lines:lines.map(l=>({raw:l,hd:/^\s*[■●◆◇□【]/.test(l),seg:segLine(l)}))};
  const words={};
  const mark=s=>s.forEach(x=>{if(x.r===undefined)return;x.need=needRuby(x.t,mode,grade);if(OVR[x.t]!==undefined)x.r=OVR[x.t];
    if(x.need){const w=words[x.t]||(words[x.t]={r:x.r,n:0});w.n++;}});
  mark(doc.title);doc.lines.forEach(l=>mark(l.seg));
  const flat=(title+"\n"+body).normalize("NFKC");const bodyN=body.normalize("NFKC").replace(/\s+/g,"");
  const tech=D.technical.filter(t=>flat.includes(t));
  const topics={};for(const [k,terms] of Object.entries(D.topics)){if(terms.some(t=>flat.includes(t)))topics[k]=1;}
  const sents=body.normalize("NFKC").split(/[。！？\n]+/).map(s=>s.trim()).filter(Boolean);
  const longS=sents.filter(s=>s.replace(/\s+/g,"").length>60);
  const kanji=bodyN.match(/[一-鿿㐀-䶿]/g)||[];
  return {grade,mode,doc,words,tech,topics,longS,n:bodyN.length,kanji,
    kanjiRatio:bodyN.length?kanji.length/bodyN.length:0,oog:kanji.length?kanji.filter(c=>(KG[c]||99)>6).length/kanji.length:0};
}

/* Word（.docx）の書き出し。ルビは Word のルビ機能（w:ruby）で入れるので、Word 上で直せる */
const xe=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function wRun(t,sz,bold){return `<w:r><w:rPr>${bold?"<w:b/>":""}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${xe(t)}</w:t></w:r>`;}
function wRuby(t,r,sz,bold){const rs=Math.max(8,Math.round(sz/2));
  return `<w:r><w:ruby><w:rubyPr><w:rubyAlign w:val="distributeSpace"/><w:hps w:val="${rs}"/><w:hpsRaise w:val="${sz-2}"/><w:hpsBaseText w:val="${sz}"/><w:lid w:val="ja-JP"/></w:rubyPr><w:rt>${wRun(r,rs,false)}</w:rt><w:rubyBase>${wRun(t,sz,bold)}</w:rubyBase></w:ruby></w:r>`;}
// 漢字の並びのルビを1字ずつに分ける（常用漢字表の音訓で読みを割り振れたときだけ）。
// まとめて1つのルビにすると Word では語ごとにしか消せないため。連濁・促音・半濁音は許す。
// 割り振れない（熟字訓・表外字など）ときは null を返し、まとめたルビのままにする
const KY={};Object.entries(D.yomi||{}).forEach(([k,v])=>KY[k]=v.split("|"));
const DAKU={};"かがきぎくぐけげこごさざしじすずせぜそぞただちぢつづてでとど".replace(/(.)(.)/g,(_,a,b)=>DAKU[a]=b);
const HAN={"は":["ば","ぱ"],"ひ":["び","ぴ"],"ふ":["ぶ","ぷ"],"へ":["べ","ぺ"],"ほ":["ぼ","ぽ"]};
function variants(c,first,last){
  const out=new Set();
  (KY[c]||[]).forEach(s=>{
    const h=[s];if(!first){if(DAKU[s[0]])h.push(DAKU[s[0]]+s.slice(1));(HAN[s[0]]||[]).forEach(v=>h.push(v+s.slice(1)));}
    h.forEach(v=>{out.add(v);if(!last&&v.length>1&&"つちくき".includes(v.at(-1)))out.add(v.slice(0,-1)+"っ");});});
  return [...out].sort((a,b)=>b.length-a.length);
}
function splitMono(t,r){
  const cs=[...t];if(cs.length<2||!r)return null;
  const go=(i,p)=>{
    if(i===cs.length)return p===r.length?[]:null;
    const c=cs[i]==="々"&&i?cs[i-1]:cs[i];
    for(const v of variants(c,i===0,i===cs.length-1)){
      if(!r.startsWith(v,p))continue;const rest=go(i+1,p+v.length);if(rest)return [v,...rest];}
    return null;};
  const m=go(0,0);return m?cs.map((c,i)=>({t:c,r:m[i]})):null;
}
function wSeg(seg,sz,bold){return seg.map(x=>{
  if(!(x.r!==undefined&&x.need&&x.r))return wRun(x.t,sz,bold);
  const m=splitMono(x.t,x.r);
  return m?m.map(y=>wRuby(y.t,y.r,sz,bold)).join(""):wRuby(x.t,x.r,sz,bold);}).join("");}
function wPara(inner,{jc,before=0,after=0,border}={}){
  return `<w:p><w:pPr>${border?'<w:pBdr><w:left w:val="single" w:sz="36" w:space="6" w:color="6B8FB3"/></w:pBdr>':""}${border==="bottom"?"":""}<w:spacing w:before="${before}" w:after="${after}"/>${jc?`<w:jc w:val="${jc}"/>`:""}</w:pPr>${inner}</w:p>`;}
